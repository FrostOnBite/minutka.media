<style>
  #mm-root {
    --mm-ink: #16181a;
    --mm-muted: #767a7d;
    --mm-line: #e6e6e6;
    --mm-teal: #03a87c;
    --mm-dark-pill: #212529;
    --mm-land: #dfe2e5;
    --mm-land-line: #c7cbd0;
    --mm-sans: -apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', Arial, sans-serif;

    width: 100vw;
    position: relative;
    left: 50%;
    right: 50%;
    margin-left: -50vw;
    margin-right: -50vw;
    font-family: var(--mm-sans);
    color: var(--mm-ink);
  }
  #mm-root * { box-sizing: border-box; }

  .mm-map-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 1000 / 667;
    background: linear-gradient(180deg, #f6f7f8 0%, #eef0f2 55%, #f6f7f8 100%);
    overflow: hidden;
  }
  #mm-svg { position:absolute; inset:0; width: 100%; height: 100%; display: block; }
  #mm-svg .mm-land { fill: var(--mm-land); stroke: var(--mm-land-line); stroke-width: 0.6; }

  .mm-pins-layer { position: absolute; inset: 0; }

  .mm-pin {
    position: absolute;
    width: 40px; height: 40px;
    margin-left: -20px; margin-top: -20px;
    border-radius: 50%;
    cursor: pointer;
    border: 2.5px solid #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
    overflow: hidden;
    background: #b9bec5;
    padding: 0;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .mm-pin:hover, .mm-pin:focus-visible {
    transform: scale(1.18);
    box-shadow: 0 4px 14px rgba(0,0,0,.32);
    z-index: 5;
  }
  .mm-pin img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mm-pin-fallback, .mm-drawer-photo-fallback {
    width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    background: #b9bec5;
  }
  @media (max-width: 640px) {
    .mm-pin { width: 32px; height: 32px; margin-left: -16px; margin-top: -16px; }
  }

  /* ---- шторка-панель справа ---- */
  .mm-drawer-backdrop {
    position: fixed; inset: 0;
    background: rgba(10, 12, 14, 0.5);
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
  }
  .mm-drawer-backdrop.mm-open { opacity: 1; pointer-events: auto; }

  .mm-drawer {
    position: fixed; top: 0; right: 0; bottom: 0;
    width: min(420px, 92vw);
    background: #fff;
    box-shadow: -12px 0 32px rgba(0,0,0,.3);
    transform: translateX(100%);
    transition: transform .25s ease;
    z-index: 1001;
    overflow-y: auto;
  }
  .mm-drawer.mm-open { transform: translateX(0); }

  .mm-drawer-close {
    position: absolute; top: 12px; right: 12px;
    width: 34px; height: 34px; border-radius: 50%;
    border: none; background: rgba(0,0,0,.5); color: #fff;
    font-size: 20px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    z-index: 2;
  }
  .mm-drawer-close:hover { background: rgba(0,0,0,.7); }

  .mm-drawer-photo, .mm-drawer-photo-fallback { width: 100%; height: 240px; }
  .mm-drawer-photo { object-fit: cover; display: block; }

  .mm-card-body { padding: 20px 22px 26px; }
  .mm-card__case { font-size: 11.5px; letter-spacing: .02em; color: var(--mm-muted); text-transform: uppercase; font-weight: 600; }
  .mm-card__name { font-size: 21px; font-weight: 800; color: var(--mm-ink); margin: 5px 0 9px; line-height: 1.2; }
  .mm-card__badge { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 3px 10px; border-radius: 20px; color: #fff; background: var(--mm-dark-pill); margin-bottom: 12px; }
  .mm-card__row { font-size: 13.5px; margin: 5px 0; line-height: 1.5; }
  .mm-card__row b { font-weight: 700; }
  .mm-card__story { font-size: 13.5px; line-height: 1.62; margin-top: 10px; color: #2b2f31; }
  .mm-card__src { display: inline-block; margin-top: 14px; font-size: 13px; font-weight: 600; color: var(--mm-teal); text-decoration: none; border-bottom: 1px solid var(--mm-teal); }
</style>

  </div>

  <div class="mm-drawer-backdrop" id="mm-backdrop"></div>
  <div class="mm-drawer" id="mm-drawer" role="dialog" aria-modal="true">
    <button class="mm-drawer-close" id="mm-drawer-close" aria-label="Закрыть">×</button>
    <div id="mm-drawer-content"></div>
  </div>
</div>

<script>
(function () {
  const PROJ = { minLon: 18.103996039960407, maxLon: 191.7709027090271, minLat: 39.69946101976646, maxLat: 83.35492590394657, VB_W: 1000, VB_H: 667, VB_H_TIGHT: 251, PAD_V: 208 };
  function shiftLon(lon) { return lon < -100 ? lon + 360 : lon; }
  function project(lat, lng) {
    const lon = shiftLon(lng);
    const x = ((lon - PROJ.minLon) / (PROJ.maxLon - PROJ.minLon)) * PROJ.VB_W;
    const yTight = PROJ.VB_H_TIGHT - ((lat - PROJ.minLat) / (PROJ.maxLat - PROJ.minLat)) * PROJ.VB_H_TIGHT;
    const y = PROJ.PAD_V + yTight;
    return [x / PROJ.VB_W * 100, y / PROJ.VB_H * 100];
  }

  // Заполняйте avatar реальным путём к фото (например /assets/images/maniacs/kiyko.jpg).
  // Если поле пустое или файл не найден — подставится заглушка-силуэт.
  const CASES = [
    {
      id: "kiyko-2026", name: "Андрей Кийко", nick: "«сосновский маньяк»",
      region: "Ленинградская область (Ропша)", lat: 59.749, lng: 29.906,
      avatar: "", convicted: "2008",
      crimeShort: "3 убийства, 9 разбойных нападений, 12 изнасилований", victims: "3 убийства",
      statusLabel: "сбежал с фронта",
      story: "Осуждён в 2008 году. В 2024-м заключил контракт с Минобороны РФ и убыл из колонии на фронт. По сообщениям СМИ, весной 2026 года числился в розыске в Ленобласти.",
      sourceName: "Радио Свобода",
      sourceUrl: "https://www.svoboda.org/a/vypuschennye-na-voynu-ubiytsy-sbegayut-s-fronta-i-nahodyat-novyh-zhertv/33768063.html"
    },
    {
      id: "tatarintsev-2023", name: "Евгений Татаринцев", nick: "",
      region: "Калужская область (Калуга)", lat: 54.513, lng: 36.261,
      avatar: "", convicted: "—", crimeShort: "убийство", victims: "1",
      statusLabel: "освобождён, живёт в Калуге",
      story: "Осуждён за убийство. Подписал контракт с ЧВК «Вагнер», по окончании полугодового контракта получил помилование и вернулся в Калугу.",
      sourceName: "Freedom / uatv.ua",
      sourceUrl: "https://uatv.ua/serijnye-ubijtsy-vyhodyat-na-svobodu-zachem-kreml-pomiloval-nasilnikov-i-manyakov/"
    },
    {
      id: "gorin-2024", name: "Денис Горин", nick: "маньяк-людоед",
      region: "Сахалинская область", lat: 46.959, lng: 142.738,
      avatar: "", convicted: "—", crimeShort: "убийство со следами каннибализма (по данным СМИ)", victims: "1",
      statusLabel: "помилован, освобождён",
      story: "По данным «Новой газеты», помилован и освобождён для участия в военных действиях. Взыскание выплат родственникам погибшей было приостановлено.",
      sourceName: "Новая газета",
      sourceUrl: "https://novayagazeta.ru/articles/2026/06/15/gvozdi-zabil-v-glaza"
    },
    {
      id: "malyshev-2024", name: "Малышев (Волгоградская область)", nick: "",
      region: "Волгоградская область", lat: 48.708, lng: 44.517,
      avatar: "", convicted: "приговор — 25 лет", crimeShort: "убийство, участие в ОПГ", victims: "3 (по данным СМИ)",
      statusLabel: "убыл на фронт",
      story: "Приговорён к 25 годам колонии особого режима. Не отбыл и половины срока — подписал контракт с Минобороны РФ и убыл на фронт.",
      sourceName: "Charter97",
      sourceUrl: "https://charter97.org/ru/news/2024/6/26/600420/"
    }
  ];

  const PLACEHOLDER_SVG_MARKUP = '<svg viewBox="0 0 24 24" width="60%" height="60%" fill="#f4f5f6"><path d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12zm0 2.4c-3.3 0-9.8 1.6-9.8 4.9v2.4h19.6v-2.4c0-3.3-6.5-4.9-9.8-4.9z"/></svg>';

  function makeAvatarNode(url, fallbackClass) {
    const wrap = document.createElement('div');
    wrap.style.width = '100%';
    wrap.style.height = '100%';
    if (url) {
      const img = document.createElement('img');
      img.src = url;
      img.alt = '';
      img.style.width = '100%';
      img.style.height = '100%';
      img.style.objectFit = 'cover';
      img.style.display = 'block';
      img.addEventListener('error', function () {
        wrap.innerHTML = '';
        const fb = document.createElement('div');
        fb.className = fallbackClass;
        fb.innerHTML = PLACEHOLDER_SVG_MARKUP;
        wrap.appendChild(fb);
      });
      wrap.appendChild(img);
    } else {
      const fb = document.createElement('div');
      fb.className = fallbackClass;
      fb.innerHTML = PLACEHOLDER_SVG_MARKUP;
      wrap.appendChild(fb);
    }
    return wrap;
  }

  const pinsLayer = document.getElementById('mm-pins');
  const backdrop = document.getElementById('mm-backdrop');
  const drawer = document.getElementById('mm-drawer');
  const drawerContent = document.getElementById('mm-drawer-content');

  function openCase(c) {
    drawerContent.innerHTML = '';
    const photoNode = makeAvatarNode(c.avatar, 'mm-drawer-photo-fallback');
    photoNode.classList.add('mm-drawer-photo');
    drawerContent.appendChild(photoNode);

    const body = document.createElement('div');
    body.className = 'mm-card-body';
    body.innerHTML = `
      <div class="mm-card__case">Дело · ${c.region}</div>
      <div class="mm-card__name">${c.name}${c.nick ? ' <span style="font-weight:400;color:var(--mm-muted)">— ' + c.nick + '</span>' : ''}</div>
      <span class="mm-card__badge">${c.statusLabel}</span>
      <div class="mm-card__row"><b>Осуждён:</b> ${c.convicted}</div>
      <div class="mm-card__row"><b>Статьи/эпизоды:</b> ${c.crimeShort}</div>
      <div class="mm-card__row"><b>Жертвы:</b> ${c.victims}</div>
      <div class="mm-card__story">${c.story}</div>
      <a class="mm-card__src" href="${c.sourceUrl}" target="_blank" rel="noopener">Источник: ${c.sourceName} →</a>
    `;
    drawerContent.appendChild(body);

    backdrop.classList.add('mm-open');
    drawer.classList.add('mm-open');
  }
  function closeDrawer() {
    backdrop.classList.remove('mm-open');
    drawer.classList.remove('mm-open');
  }

  document.getElementById('mm-drawer-close').addEventListener('click', closeDrawer);
  backdrop.addEventListener('click', closeDrawer);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });

  CASES.forEach((c) => {
    const [xPct, yPct] = project(c.lat, c.lng);
    const pin = document.createElement('button');
    pin.type = 'button';
    pin.className = 'mm-pin';
    pin.style.left = xPct + '%';
    pin.style.top = yPct + '%';
    pin.setAttribute('aria-label', c.name);
    pin.appendChild(makeAvatarNode(c.avatar, 'mm-pin-fallback'));
    pin.addEventListener('click', () => openCase(c));
    pinsLayer.appendChild(pin);
  });
})();
</script>

<style>
  #mm-root {
    --mm-black: #000000;
    --mm-white: #ffffff;
    --mm-ink: #16181a;
    --mm-muted: #767a7d;
    --mm-line: #e6e6e6;
    --mm-teal: #03a87c;
    --mm-dark-pill: #212529;
    --mm-mint: #e8f3ec;
    --mm-land: #eeeeee;
    --mm-land-line: #d3d3d3;
    --mm-amber: #c67c2e;
    --mm-grey-status: #9a9a9a;
    --mm-sans: -apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', Arial, sans-serif;

    background: var(--mm-white);
    color: var(--mm-ink);
    font-family: var(--mm-sans);
    border: 1px solid var(--mm-line);
    border-radius: 6px;
    overflow: hidden;
    margin: 2.5rem 0;
    max-width: 100%;
  }
  #mm-root * { box-sizing: border-box; }

  .mm-header {
    padding: 20px 22px 14px;
    border-bottom: 1px solid var(--mm-line);
  }
  .mm-header__eyebrow {
    font-size: 12.5px;
    color: var(--mm-muted);
    margin-bottom: 4px;
  }
  .mm-header__row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .mm-header__title {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.01em;
    color: var(--mm-ink);
    position: relative;
    display: inline-block;
    padding-bottom: 6px;
  }
  .mm-header__title::after {
    content: "";
    position: absolute;
    left: 0; bottom: 0;
    width: 46px; height: 4px;
    background: var(--mm-black);
    border-radius: 2px;
  }
  .mm-header__count {
    font-size: 14px;
    font-weight: 700;
    color: var(--mm-teal);
    white-space: nowrap;
  }

  .mm-body {
    display: grid;
    grid-template-columns: 1fr;
  }
  @media (min-width: 780px) {
    .mm-body { grid-template-columns: 1.6fr 1fr; }
  }

  .mm-map-wrap {
    background: #fafafa;
    padding: 10px;
    border-bottom: 1px solid var(--mm-line);
  }
  @media (min-width: 780px) {
    .mm-map-wrap { border-bottom: none; border-right: 1px solid var(--mm-line); }
  }
  #mm-svg { width: 100%; height: auto; display: block; }
  #mm-svg .mm-land { fill: var(--mm-land); stroke: var(--mm-land-line); stroke-width: 0.6; }

  .mm-pin { cursor: pointer; }
  .mm-pin circle {
    stroke: #fff; stroke-width: 1;
    transform-origin: center;
    transition: r .12s ease;
  }
  .mm-pin:hover circle, .mm-pin.mm-active circle { r: 6.5; }
  .mm-pin--released circle { fill: var(--mm-teal); }
  .mm-pin--fled circle { fill: var(--mm-amber); }
  .mm-pin--dead circle { fill: var(--mm-grey-status); }
  .mm-pin--returned circle { fill: var(--mm-dark-pill); }

  .mm-legend {
    display: flex; flex-wrap: wrap; gap: 12px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--mm-line);
    font-size: 11.5px;
    color: var(--mm-muted);
  }
  .mm-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .mm-legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  .mm-side {
    display: flex;
    flex-direction: column;
  }

  .mm-card {
    padding: 16px 18px;
    border-bottom: 1px solid var(--mm-line);
    background: var(--mm-mint);
    min-height: 160px;
  }
  .mm-card__case { font-size: 11.5px; letter-spacing: .02em; color: #4d6b5b; text-transform: uppercase; font-weight: 600; }
  .mm-card__name { font-size: 19px; font-weight: 800; color: var(--mm-ink); margin: 4px 0 8px; line-height: 1.2; }
  .mm-card__badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; padding: 3px 9px 3px 7px; border-radius: 20px; color: #fff; margin-bottom: 10px; }
  .mm-card__badge i { width: 6px; height: 6px; border-radius: 50%; background: #fff; display: inline-block; }
  .mm-card__row { font-size: 13px; margin: 4px 0; line-height: 1.45; color: var(--mm-ink); }
  .mm-card__row b { font-weight: 700; }
  .mm-card__story { font-size: 13px; line-height: 1.6; margin-top: 8px; color: #2b2f31; }
  .mm-card__src { display: inline-block; margin-top: 12px; font-size: 12.5px; font-weight: 600; color: var(--mm-teal); text-decoration: none; border-bottom: 1px solid var(--mm-teal); }
  .mm-card__empty { color: var(--mm-muted); font-size: 13px; padding-top: 6px; }

  .mm-list {
    overflow-y: auto;
    max-height: 320px;
  }
  .mm-list::-webkit-scrollbar { width: 8px; }
  .mm-list::-webkit-scrollbar-thumb { background: var(--mm-line); }

  .mm-list-item {
    padding: 11px 18px;
    border-bottom: 1px solid var(--mm-line);
    cursor: pointer;
    transition: background .12s ease;
  }
  .mm-list-item:hover { background: #f7f7f7; }
  .mm-list-item.mm-active { background: var(--mm-mint); }
  .mm-list-item__top {
    display: flex; align-items: center; gap: 7px;
    font-size: 11px; color: var(--mm-muted);
    margin-bottom: 3px;
  }
  .mm-status-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .mm-list-item__name { font-weight: 700; color: var(--mm-ink); font-size: 14.5px; }
  .mm-list-item__region { font-size: 12px; color: var(--mm-muted); }

  .mm-footnote {
    font-size: 11px;
    color: var(--mm-muted);
    padding: 10px 18px;
    border-top: 1px solid var(--mm-line);
  }
</style>

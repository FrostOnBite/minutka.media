<style>
  #mm-root {
    --mm-ink: #16181a;
    --mm-muted: #767a7d;
    --mm-line: #e6e6e6;
    --mm-teal: #03a87c;
    --mm-amber: #c67c2e;
    --mm-grey-status: #9a9a9a;
    --mm-dark-pill: #212529;
    --mm-mint: #e8f3ec;
    --mm-sans: -apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', Arial, sans-serif;

    width: 100vw;
    position: relative;
    left: 50%;
    right: 50%;
    margin-left: -50vw;
    margin-right: -50vw;
    font-family: var(--mm-sans);
    color: var(--mm-ink);
  }
  #mm-root * { box-sizing: border-box; }

  .mm-map-wrap {
    position: relative;
    width: 100%;
    height: clamp(320px, 34vw, 560px);
    background: #fff;
    overflow: hidden;
  }
  #mm-svg { position:absolute !important; left:0 !important; top:0 !important; bottom:0 !important; width: 82% !important; height: 100% !important; max-width: none !important; max-height: none !important; display: block !important; }
  #mm-svg .mm-land { fill: #d7dade; stroke: #b7bcc2; stroke-width: 0.7; }

  .mm-pin { cursor: pointer; }
  .mm-pin circle.mm-ring { fill: #ffffff; stroke: #212529; stroke-width: 1.8; }
  .mm-pin-fallback-icon { fill: #9a9ea3; }
  .mm-pin-group { transition: transform .12s ease; transform-box: fill-box; transform-origin: center; }
  .mm-pin:hover .mm-pin-group, .mm-pin:focus-visible .mm-pin-group { transform: scale(1.2); }

  .mm-legend {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 14px;
    padding: 10px 16px;
    background: #fff;
    border-top: 1px solid var(--mm-line);
    font-size: 12px;
    color: var(--mm-muted);
  }
  .mm-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .mm-legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; border: 1.5px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.25); }

  /* ---- шторка справа, ограничена площадью карты ---- */
  .mm-drawer-backdrop {
    position: absolute; inset: 0;
    background: rgba(10, 12, 14, 0.45);
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
  }
  .mm-drawer-backdrop.mm-open { opacity: 1; pointer-events: auto; }

  .mm-drawer {
    position: absolute; top: 50%; right: 18px;
    width: min(340px, 82%);
    max-height: calc(100% - 36px);
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 16px 40px rgba(0,0,0,.35);
    transform: translateY(-50%) translateX(24px) scale(.96);
    opacity: 0;
    transition: transform .22s ease, opacity .22s ease;
    z-index: 101;
    overflow-y: auto;
    pointer-events: none;
  }
  .mm-drawer.mm-open { transform: translateY(-50%) translateX(0) scale(1); opacity: 1; pointer-events: auto; }
  @media (max-width: 480px) {
    .mm-drawer { right: 10px; left: 10px; width: auto; }
    .mm-map-wrap { height: clamp(420px, 90vw, 560px); }
    .mm-drawer-photo, .mm-drawer-photo-fallback { height: 96px; }
    .mm-card-body { padding: 10px 14px 14px; }
    .mm-card__name { font-size: 17px; }
  }

  .mm-drawer-close {
    position: absolute; top: 12px; right: 12px;
    width: 34px; height: 34px; border-radius: 50%;
    border: none; background: rgba(0,0,0,.5); color: #fff;
    font-size: 20px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    z-index: 2;
  }
  .mm-drawer-close:hover { background: rgba(0,0,0,.7); }

  .mm-drawer-photo, .mm-drawer-photo-fallback { width: 100%; height: 130px; border-radius: 14px 14px 0 0; }
  .mm-drawer-photo { object-fit: cover; display: block; }
  .mm-drawer-photo-fallback { display: flex; align-items: center; justify-content: center; background: #e2e5e8; }

  .mm-card-body { padding: 14px 18px 18px; background: var(--mm-mint); border-radius: 0 0 14px 14px; }
  .mm-card__case { font-size: 11.5px; letter-spacing: .02em; color: #4d6b5b; text-transform: uppercase; font-weight: 600; }
  .mm-card__name { font-size: 20px; font-weight: 800; color: var(--mm-ink); margin: 5px 0 9px; line-height: 1.2; }
  .mm-card__badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; padding: 3px 10px 3px 8px; border-radius: 20px; color: #fff; margin-bottom: 12px; }
  .mm-card__badge i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.9); display: inline-block; }
  .mm-card__row { font-size: 13.5px; margin: 5px 0; line-height: 1.5; }
  .mm-card__row b { font-weight: 700; }
  .mm-card__story { font-size: 13.5px; line-height: 1.62; margin-top: 10px; color: #2b2f31; }
  .mm-card__src { display: inline-block; margin-top: 14px; font-size: 13px; font-weight: 600; color: var(--mm-teal); text-decoration: none; border-bottom: 1px solid var(--mm-teal); }
</style>

<script>
(function () {
  const LAT0 = 61.52719346185651, LON0 = 104.93744937449375;
  const D2R = Math.PI / 180;
  const BOUNDS = { minX: -0.766330391545678, maxX: 0.5778787992064487, minY: -0.44735505259794256, maxY: 0.29186962070471134, VB_W: 1000, VB_H: 550 };
  function shiftLon(lon) { return lon < -100 ? lon + 360 : lon; }
  function azimuthal(lonDeg, latDeg) {
    const lat = latDeg * D2R, lon = lonDeg * D2R;
    const lat0 = LAT0 * D2R, lon0 = LON0 * D2R;
    const cosc = Math.sin(lat0) * Math.sin(lat) + Math.cos(lat0) * Math.cos(lat) * Math.cos(lon - lon0);
    const k = Math.sqrt(2 / (1 + cosc));
    const x = k * Math.cos(lat) * Math.sin(lon - lon0);
    const y = k * (Math.cos(lat0) * Math.sin(lat) - Math.sin(lat0) * Math.cos(lat) * Math.cos(lon - lon0));
    return [x, -y];
  }
  function project(lat, lng) {
    const lon = shiftLon(lng);
    const [x, y] = azimuthal(lon, lat);
    const sx = ((x - BOUNDS.minX) / (BOUNDS.maxX - BOUNDS.minX)) * BOUNDS.VB_W;
    const sy = ((y - BOUNDS.minY) / (BOUNDS.maxY - BOUNDS.minY)) * BOUNDS.VB_H;
    return [sx, sy];
  }

      story: "Осуждён за убийство. Подписал контракт с ЧВК «Вагнер», по окончании полугодового контракта получил помилование и вернулся в Калугу.",
      sourceName: "Freedom / uatv.ua",
      sourceUrl: "https://uatv.ua/serijnye-ubijtsy-vyhodyat-na-svobodu-zachem-kreml-pomiloval-nasilnikov-i-manyakov/"
    },

      sourceName: "Новая газета",
      sourceUrl: "https://novayagazeta.ru/articles/2026/06/15/gvozdi-zabil-v-glaza"
    },
    {
      id: "malyshev-2024", name: "Малышев (Волгоградская область)", nick: "",

      sourceName: "Charter97",
      sourceUrl: "https://charter97.org/ru/news/2024/6/26/600420/"
    }
  ];

  const NS = 'http://www.w3.org/2000/svg';
  const PERSON_ICON_PATH = 'M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12zm0 2.4c-3.3 0-9.8 1.6-9.8 4.9v2.4h19.6v-2.4c0-3.3-6.5-4.9-9.8-4.9z';

  const pinsG = document.getElementById('mm-pins');
  const backdrop = document.getElementById('mm-backdrop');
  const drawer = document.getElementById('mm-drawer');
  const drawerContent = document.getElementById('mm-drawer-content');

  function openCase(c) {
    const color = STATUS_COLOR[c.status] || '#03a87c';
    drawerContent.innerHTML = '';

    if (c.avatar) {
      const img = document.createElement('img');
      img.className = 'mm-drawer-photo';
      img.src = c.avatar;
      img.alt = '';
      img.addEventListener('error', function () {
        img.outerHTML = '<div class="mm-drawer-photo-fallback"><svg viewBox="0 0 24 24" width="52" height="52" fill="#aeb2b8"><path d="' + PERSON_ICON_PATH + '"/></svg></div>';

      drawerContent.appendChild(img);

      const fb = document.createElement('div');

      fb.innerHTML = '<svg viewBox="0 0 24 24" width="52" height="52" fill="#aeb2b8"><path d="' + PERSON_ICON_PATH + '"/></svg>';
      drawerContent.appendChild(fb);

  CASES.forEach((c) => {
    const [x, y] = project(c.lat, c.lng);
    const color = STATUS_COLOR[c.status] || '#03a87c';

    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'mm-pin');
    g.setAttribute('tabindex', '0');
    g.setAttribute('role', 'button');
    g.setAttribute('aria-label', c.name);
    g.setAttribute('transform', `translate(${x},${y})`);

    const inner = document.createElementNS(NS, 'g');
    inner.setAttribute('class', 'mm-pin-group');

    const ring = document.createElementNS(NS, 'circle');
    ring.setAttribute('class', 'mm-ring');
    ring.setAttribute('r', '11');
    inner.appendChild(ring);

    const statusDot = document.createElementNS(NS, 'circle');
    statusDot.setAttribute('r', '3.4');
    statusDot.setAttribute('cx', '8.4');
    statusDot.setAttribute('cy', '8.4');
    statusDot.setAttribute('fill', color);
    statusDot.setAttribute('stroke', '#fff');
    statusDot.setAttribute('stroke-width', '1');

    if (c.avatar) {
      const img = document.createElementNS(NS, 'image');
      img.setAttribute('href', c.avatar);
      img.setAttribute('x', '-10'); img.setAttribute('y', '-10');
      img.setAttribute('width', '20'); img.setAttribute('height', '20');
      img.setAttribute('preserveAspectRatio', 'xMidYMid slice');
      img.setAttribute('clip-path', 'url(#mm-avatar-clip)');
      img.addEventListener('error', function () {
        img.remove();
        const fbIcon = document.createElementNS(NS, 'path');
        fbIcon.setAttribute('class', 'mm-pin-fallback-icon');
        fbIcon.setAttribute('d', PERSON_ICON_PATH);
        fbIcon.setAttribute('transform', 'translate(-8,-8) scale(0.67)');
        inner.insertBefore(fbIcon, statusDot);
      });
      inner.appendChild(img);
    } else {
      const fbIcon = document.createElementNS(NS, 'path');
      fbIcon.setAttribute('class', 'mm-pin-fallback-icon');
      fbIcon.setAttribute('d', PERSON_ICON_PATH);
      fbIcon.setAttribute('transform', 'translate(-8,-8) scale(0.67)');
      inner.appendChild(fbIcon);
    }

    inner.appendChild(statusDot);
    g.appendChild(inner);
    g.addEventListener('click', () => openCase(c));
    g.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openCase(c); } });
    pinsG.appendChild(g);
  });

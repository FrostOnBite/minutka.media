{% if page.telegram_post %}
<div id="comments" class="mt-5">
  <script async src="https://telegram.org/js/telegram-widget.js?22"
    data-telegram-discussion="{{ page.telegram_post }}"
    data-comments-limit="5"
    data-colorful="1"
    data-color="000000" 
    data-dark-color="FFFFFF">
  </script>
</div>
{% endif %}

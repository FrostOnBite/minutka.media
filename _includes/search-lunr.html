<script src="{{site.baseurl}}/assets/js/lunr.js"></script>

<script>
(function() {
    let lunrIdx = null;
    let lunrDocuments = null;
    let indexLoaded = false;

    // Данные для индекса - ТОЛЬКО ПОСТЫ (только необходимые поля)
    {% assign counter = 0 %}
    window.lunrDocumentsData = [{% for page in site.posts %}{
        "id": {{ counter }},
        "url": "{{ site.url }}{{site.baseurl}}{{ page.url }}",
        "title": "{{ page.title }}",
        "date": "{{ page.date | date: "%d.%m.%Y" }}"{% assign counter = counter | plus: 1 %}
        }{% if forloop.last %}{% else %}, {% endif %}{% endfor %}];

    console.log('Lunr documents loaded:', window.lunrDocumentsData.length);

    // Ленивая инициализация индекса (больше не нужна, но оставляем для совместимости)
    function initLunrIndex() {
        if (indexLoaded) return;
        indexLoaded = true;
        lunrDocuments = window.lunrDocumentsData;
    }

    function closeLunrSearch() {
        const modal = document.getElementById('lunrsearchresults');
        if (modal) {
            modal.style.display = 'none';
            document.body.classList.remove('modal-open');
        }
    }

    window.lunr_search = function(term) {
        if (!term) return false;

        initLunrIndex();

        const modal = document.getElementById('lunrsearchresults');
        modal.style.display = 'block';
        document.body.classList.add('modal-open');

        const searchTerm = term.toLowerCase();
        const results = lunrDocuments.filter(doc => 
            doc.title.toLowerCase().includes(searchTerm)
        );

        const modalHeader = document.getElementById('modtit');
        modalHeader.querySelector('.modal-title').textContent = "Результаты поиска: '" + term + "'";

        const ul = document.querySelector('#lunrsearchresults ul');
        let html = '';

        if (results.length > 0) {
            results.slice(0, 50).forEach(function(result) {
                const url = result.url;
                const title = result.title;
                const date = result.date;
                html += "<li class='lunrsearchresult'><a href='" + url + "'><small class='text-muted'>" + date + "</small><br /><span class='title'>" + title + "</span></a></li>";
            });
        } else {
            html = "<li class='lunrsearchresult'>Ничего не найдено</li>";
        }

        ul.innerHTML = html;
        return false;
    };

    // Закрытие при Escape
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeLunrSearch();
    });

    // Закрытие при клике на кнопку или вне модального окна
    document.addEventListener('click', function(e) {
        const modal = document.getElementById('lunrsearchresults');
        const modalContent = document.querySelector('#lunrsearchresults .modal-content');
        
        if (e.target.closest('button[onclick="closeLunrSearch()"]')) {
            closeLunrSearch();
            return;
        }
        
        if (modal && modal.style.display === 'block') {
            if (modalContent && !modalContent.contains(e.target)) {
                closeLunrSearch();
            }
        }
    });

    window.closeLunrSearch = closeLunrSearch;
})();
</script>

<style>
    #lunrsearchresults {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        z-index: 9999 !important;
        display: none;
        align-items: center;
        justify-content: center;
        overflow-y: auto;
        padding: 20px;
    }

    #lunrsearchresults .modal-dialog {
        max-width: 600px;
    }

    #lunrsearchresults .modal-content {
        border-radius: 0;
    }

    .lunrsearchresult {
        list-style: none;
        padding: 12px 0;
        border-bottom: 1px solid #f0f0f0;
    }

    .lunrsearchresult:last-child {
        border-bottom: none;
    }

    .lunrsearchresult .title {
        color: #d9230f;
        font-weight: 600;
    }

    .lunrsearchresult .url {
        color: silver;
        font-size: 12px;
    }

    .lunrsearchresult a {
        display: block;
        color: #777;
        text-decoration: none;
    }

    .lunrsearchresult a:hover .title {
        text-decoration: underline;
    }
</style>

<form class="bd-search hidden-sm-down" onsubmit="return lunr_search(document.getElementById('lunrsearch').value);">
    <input type="text" class="form-control text-small bg-black" id="lunrsearch" name="q" value="" placeholder="Поиск" autocomplete="off">
</form>

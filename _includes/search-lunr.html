<script src="{{site.baseurl}}/assets/js/lunr.js"></script>

<script>
(function() {
    let lunrIdx = null;
    let lunrDocuments = null;
    let indexLoaded = false;

    // Данные для индекса (генерируются Jekyll)
    {% assign counter = 0 %}
    window.lunrDocumentsData = [{% for page in site.pages %}{% if page.url contains '.xml' or page.url contains 'assets' %}{% else %}{
        "id": {{ counter }},
        "url": "{{ site.url }}{{site.baseurl}}{{ page.url }}",
        "title": "{{ page.title }}",
        "body": "{{ page.content | markdownify | replace: '.', '. ' | replace: '</h2>', ': ' | replace: '</h3>', ': ' | replace: '</h4>', ': ' | replace: '</p>', ' ' | strip_html | strip_newlines | replace: '  ', ' ' | replace: '"', ' ' }}"{% assign counter = counter | plus: 1 %}
        }, {% endif %}{% endfor %}{% for page in site.without-plugin %}{
        "id": {{ counter }},
        "url": "{{ site.url }}{{site.baseurl}}{{ page.url }}",
        "title": "{{ page.title }}",
        "body": "{{ page.content | markdownify | replace: '.', '. ' | replace: '</h2>', ': ' | replace: '</h3>', ': ' | replace: '</h4>', ': ' | replace: '</p>', ' ' | strip_html | strip_newlines | replace: '  ', ' ' | replace: '"', ' ' }}"{% assign counter = counter | plus: 1 %}
        }, {% endfor %}{% for page in site.posts %}{
        "id": {{ counter }},
        "url": "{{ site.url }}{{site.baseurl}}{{ page.url }}",
        "title": "{{ page.title }}",
        "body": "{{ page.date | date: "%Y/%m/%d" }} - {{ page.content | markdownify | replace: '.', '. ' | replace: '</h2>', ': ' | replace: '</h3>', ': ' | replace: '</h4>', ': ' | replace: '</p>', ' ' | strip_html | strip_newlines | replace: '  ', ' ' | replace: '"', ' ' }}"{% assign counter = counter | plus: 1 %}
        }{% if forloop.last %}{% else %}, {% endif %}{% endfor %}];

    // Ленивая инициализация индекса
    function initLunrIndex() {
        if (indexLoaded) return;
        
        indexLoaded = true;
        lunrDocuments = window.lunrDocumentsData;

        lunrIdx = lunr(function () {
            this.ref('id');
            this.field('title', { boost: 10 });
            this.field('body');

            lunrDocuments.forEach(function (doc) {
                this.add(doc);
            }, this);
        });
    }

    function closeLunrSearch() {
        const modal = document.getElementById('lunrsearchresults');
        if (modal) {
            modal.style.display = 'none';
            document.body.classList.remove('modal-open');
        }
    }

    window.lunr_search = function(term) {
        initLunrIndex(); // Инициализируем при первом поиске

        const modal = document.getElementById('lunrsearchresults');
        modal.style.display = 'block';
        document.body.classList.add('modal-open');

        if (!term) {
            document.querySelector('#lunrsearchresults .modal-body ul').innerHTML = '<li>Введите поисковый запрос</li>';
            return false;
        }

        const results = lunrIdx.search(term);
        let html = '';

        document.getElementById('modtit').innerHTML = "<h5 class='modal-title'>Результаты поиска: '" + term + "'</h5><button type='button' class='close' onclick='closeLunrSearch()' aria-label='Close'>&times;</button>";

        if (results.length > 0) {
            results.slice(0, 50).forEach(function(result) {
                const ref = result['ref'];
                const url = lunrDocuments[ref]['url'];
                const title = lunrDocuments[ref]['title'];
                const body = lunrDocuments[ref]['body'].substring(0, 160) + '...';
                html += "<li class='lunrsearchresult'><a href='" + url + "'><span class='title'>" + title + "</span><br /><small><span class='body'>" + body + "</span><br /><span class='url'>" + url + "</span></small></a></li>";
            });
        } else {
            html = "<li class='lunrsearchresult'>Ничего не найдено</li>";
        }

        document.querySelector('#lunrsearchresults .modal-body ul').innerHTML = html;
        return false;
    };

    // Закрытие при Escape
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeLunrSearch();
    });

    // Закрытие при клике на кнопку
    document.addEventListener('click', function(e) {
        if (e.target.id === 'btnx') closeLunrSearch();
    });

    // Оставляем функцию для совместимости
    window.closeLunrSearch = closeLunrSearch;
})();
</script>

<style>
    #lunrsearchresults {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        z-index: 9999 !important;
        display: none;
        align-items: center;
        justify-content: center;
        overflow-y: auto;
        padding: 20px;
    }

    #lunrsearchresults .modal {
        position: relative;
        background: white;
        border-radius: 8px;
        max-width: 600px;
        width: 100%;
        margin: auto;
    }

    .lunrsearchresult {
        list-style: none;
        padding: 12px 0;
        border-bottom: 1px solid #f0f0f0;
    }

    .lunrsearchresult:last-child {
        border-bottom: none;
    }

    .lunrsearchresult .title {
        color: #d9230f;
        font-weight: 600;
    }

    .lunrsearchresult .url {
        color: silver;
        font-size: 12px;
    }

    .lunrsearchresult a {
        display: block;
        color: #777;
        text-decoration: none;
    }

    .lunrsearchresult a:hover .title {
        text-decoration: underline;
    }
</style>

<form class="bd-search hidden-sm-down" onsubmit="return lunr_search(document.getElementById('lunrsearch').value);">
    <input type="text" class="form-control text-small bg-black" id="lunrsearch" name="q" value="" placeholder="Поиск" autocomplete="off">
</form>

<div id="lunrsearchresults">
    <div class="modal fade show d-block" tabindex="-1" role="dialog">
        <div class="modal-dialog shadow-lg" role="document">
            <div class="modal-content">
                <div class="modal-header" id="modtit">
                    <button type="button" class="close" id="btnx" onclick="closeLunrSearch()" aria-label="Close">&times;</button>
                </div>
                <div class="modal-body">
                    <ul class="mb-0"></ul>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-sm" onclick="closeLunrSearch()">Закрыть</button>
                </div>
            </div>
        </div>
    </div>
</div>

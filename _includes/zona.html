  <div class="wrapper">
    <div class="banner">
      <div class="header-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <h2 style="margin: 0;">Список погибших и пропавших без вести российских военных</h2>
          <a href="https://200.zona.media/" target="_blank" style="color: rgba(255,255,255,0.8); text-decoration: none; font-size: 14px; white-space: nowrap; margin-left: 20px;">
            <span id="statsNumber">загрузка...</span>
          </a>
        </div>
        
        <div class="search-container">
          <div class="search-input-wrapper">
            <input 
              type="text" 
              id="searchInput" 
              placeholder="Найти человека"
              autocomplete="off"
            >
            <div class="search-icon">
              <svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="17" cy="17" r="6" stroke="white" stroke-width="1.8"></circle>
                <path d="M21.5 21.5L24.5 24.5" stroke="white" stroke-width="1.9" stroke-linecap="square"></path>
              </svg>
            </div>
          </div>
          <div id="autocomplete-list" class="autocomplete-items"></div>
        </div>
      </div>

      <!-- Карточка с полной информацией -->
      <div id="fullInfoCard" class="full-info" style="position: relative;">
        <button class="close-button" onclick="hideFullInfo()">×</button>
        <div class="full-name" id="cardName"></div>
        <div class="region-info" id="cardRegion"></div>
        <div class="status-badge">Погиб</div>
        <a id="cardLink" class="detail-link" href="#" target="_blank">Подробнее</a>
      </div>
    </div>
  </div>

  <script>
    let database = [];
    let isLoading = false;

    // Загрузка базы данных из нескольких файлов
    async function loadDatabase() {
      isLoading = true;
      const allData = [];

      // Добавь сюда все части, которые получатся после разделения JSON
      const parts = [
        'zona_part1.json',
        'zona_part2.json',
        'zona_part3.json'
      ];

      try {
        for (const file of parts) {
          const response = await fetch(file);
          const part = await response.json();
          allData.push(...part);
          console.log(`Загружена часть: ${file}, записей: ${part.length}`);
        }

        database = allData;
        console.log(`База полностью загружена: ${database.length} записей`);
        document.getElementById('statsNumber').textContent = database.length.toLocaleString('ru-RU');

      } catch (error) {
        console.error('Ошибка загрузки базы:', error);
        document.getElementById('statsNumber').textContent = 'ошибка';
      } finally {
        isLoading = false;
      }
    }

    // Поиск
    function searchDatabase(query) {
      if (!query || query.length < 2) return [];
      
      const searchTerm = query.toLowerCase();
      
      const results = database.filter(person => 
        person.name.toLowerCase().includes(searchTerm)
      );
      
      console.log(`Поиск "${query}": найдено ${results.length} из ${database.length}`);
      
      return results.slice(0, 50);
    }

    // Подсветка совпадений
    function highlightMatch(text, query) {
      const regex = new RegExp(`(${query})`, 'gi');
      return text.replace(regex, '<span class="highlight">$1</span>');
    }

    // Показ полной карточки
    function showFullInfo(person) {
      const card = document.getElementById('fullInfoCard');
      const nameEl = document.getElementById('cardName');
      const regionEl = document.getElementById('cardRegion');
      const linkEl = document.getElementById('cardLink');

      nameEl.textContent = person.name;
      
      // Формируем информацию о регионе и подразделении
      let regionHTML = '';
      
      function formatText(text) {
        if (!text) return '';
        return text
          .replace(/_/g, ' ')
          .replace(/\s+/g, ' ')
          .trim()
          .toLowerCase()
          .replace(/(^|\s)\S/g, (a) => a.toUpperCase());
      }

      if (person.region) {
        regionHTML = formatText(person.region);
      }

      if (person.unit) {
        regionHTML += (regionHTML ? ', ' : '') + formatText(person.unit);
      }

      regionEl.textContent = regionHTML || 'Регион не указан';
      
      linkEl.href = person.url;

      card.classList.add('show');
      
      // Скроллим к карточке
      setTimeout(() => {
        card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }, 100);
    }

    // Скрытие полной карточки
    function hideFullInfo() {
      const card = document.getElementById('fullInfoCard');
      card.classList.remove('show');
    }

    // Показ автокомплита
    function showAutocomplete(results, query) {
      const container = document.getElementById('autocomplete-list');
      container.innerHTML = '';
      
      if (isLoading) {
        container.innerHTML = '<div class="loading"><span class="spinner"></span></div>';
        container.classList.add('show');
        return;
      }
      
      if (results.length === 0) {
        container.innerHTML = '<div class="no-results">Ничего не найдено</div>';
        container.classList.add('show');
        return;
      }
      
      results.forEach((person) => {
        const item = document.createElement('div');
        item.className = 'autocomplete-item';
        
        // Просто имя с подсветкой
        const nameDiv = document.createElement('div');
        nameDiv.className = 'item-name';
        nameDiv.innerHTML = highlightMatch(person.name, query);
        item.appendChild(nameDiv);
        
        // Клик показывает полную карточку
        item.addEventListener('click', () => {
          showFullInfo(person);
          hideAutocomplete();
        });
        
        container.appendChild(item);
      });
      
      container.classList.add('show');
    }

    // Скрытие автокомплита
    function hideAutocomplete() {
      const container = document.getElementById('autocomplete-list');
      setTimeout(() => {
        container.classList.remove('show');
      }, 200);
    }

    // Обработка ввода
    const searchInput = document.getElementById('searchInput');
    let searchTimeout;

    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.trim();
      
      clearTimeout(searchTimeout);
      
      if (query.length < 2) {
        hideAutocomplete();
        return;
      }
      
      searchTimeout = setTimeout(() => {
        const results = searchDatabase(query);
        showAutocomplete(results, query);
      }, 150);
    });

    searchInput.addEventListener('focus', (e) => {
      const query = e.target.value.trim();
      if (query.length >= 2) {
        const results = searchDatabase(query);
        showAutocomplete(results, query);
      }
    });

    searchInput.addEventListener('blur', () => {
      hideAutocomplete();
    });

    // Навигация клавиатурой
    searchInput.addEventListener('keydown', (e) => {
      const container = document.getElementById('autocomplete-list');
      const items = container.querySelectorAll('.autocomplete-item');
      const activeItem = container.querySelector('.autocomplete-item.active');
      
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (!activeItem && items.length > 0) {
          items[0].classList.add('active');
        } else if (activeItem && activeItem.nextElementSibling) {
          activeItem.classList.remove('active');
          activeItem.nextElementSibling.classList.add('active');
          activeItem.nextElementSibling.scrollIntoView({ block: 'nearest' });
        }
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (activeItem && activeItem.previousElementSibling) {
          activeItem.classList.remove('active');
          activeItem.previousElementSibling.classList.add('active');
          activeItem.previousElementSibling.scrollIntoView({ block: 'nearest' });
        }
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (activeItem) {
          activeItem.click();
        }
      } else if (e.key === 'Escape') {
        hideAutocomplete();
      }
    });

    // Закрытие при клике вне
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-container')) {
        hideAutocomplete();
      }
    });

    // Загрузка базы при старте
    loadDatabase();
  </script>

# Site
name: 'minutka.media'
description: 'minutka.media - голос тех, кого не услышат по телевизору. Только факты и люди.'
baseurl: 'http://www.minutka.media'
disqus: 'minutka-media'
email: 'knock@minutka.media'
mailchimp-list: ''

include: ["_pages"]
permalink: /:title/

# Plugins
plugins: 
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-seo-tag
  
authors:
    kira:
      name:           Кира Вешнякова
      site:           www.minutka.media
      avatar:         /assets/images/people/kira-veshnyakova.jpg
      bio:            ""
      email:          knock@minutka.media
      twitter:        

    adelina:
      name:           Аделина Сезонова
      site:           www.minutka.media
      avatar:         /assets/images/people/adelina-sezonova.jpg
      bio:            ""
      email:          knock@minutka.media
      twitter:        
 
# Defaults
defaults:

  # all posts
  - scope:
      path: "_posts"
    values:
      layout: post
      author: sal
      avatar: /assets/images/avatar1.jpg
      
  # all pages
  - scope:
      path: "_pages"
    values:
      layout: page
      
# Syntax
markdown: kramdown
highlighter: rouge

# Paginate
paginate: 10



# Exclude metadata and development time dependencies (like Grunt plugins)
exclude: [README.markdown, package.json, grunt.js, Gruntfile.js, Gruntfile.coffee, node_modules]
